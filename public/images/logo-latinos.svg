<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(10, 10)">
    <rect width="70" height="70" rx="18" fill="url(#latinos-grad)" />
    <!-- Shield / Wrench / Water Droplet motif -->
    <path d="M35 15 C44 26 50 36 50 45 C50 54 43 61 35 61 C27 61 20 54 20 45 C20 36 26 26 35 15 Z" fill="#ffffff" opacity="0.95" />
    <path d="M35 27 C40 34 43 40 43 46 C43 51 39 55 35 55 C31 55 27 51 27 46 C27 40 30 34 35 27 Z" fill="url(#latinos-gold)" />
    <circle cx="35" cy="46" r="4" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="96" y="44" font-family="'Archivo', 'Montserrat', sans-serif" font-weight="900" font-size="30" fill="#0b192c" letter-spacing="-0.03em">
    LATINOS
  </text>
  <text x="236" y="44" font-family="'Archivo', 'Montserrat', sans-serif" font-weight="800" font-size="28" fill="#d97706" letter-spacing="-0.02em">
